<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor's Information</title>
</head>

<body>
    <form method="post">
        <h1>Donor Information</h1>
        <table>
            <tr>
                <td><label for="firstname">First Name*</label></td>
                <td><input type="text" id="firstname" name="firstname" required></td>
            </tr>

            <tr>
                <td><label for="lastname">Last Name*</label></td>
                <td><input type="text" id="lastname" name="lastname" required></td>
            </tr>

            <tr>
                <td><label for="company">Company</label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>

            <tr>
                <td><label for="address1">Address 1*</label></td>
                <td><input type="text" id="address1" name="address1" required></td>
            </tr>
            
            <tr>
                <td><label for="address2">Address 2</label></td>
                <td><input type="text" id="address2" name="address2"></td>
            </tr>

            <tr>
                <td><label for="city">City*</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>

            <tr>
                <td><label for="state">State*</label></td>
                <td>
                    <select id="state" name="state" required>
                        <option>Select a State</option>
                        <option>Bogura</option>
                        <option>Dhaka</option>
                        <option>Khulna</option>
                        <option>Rajshahi</option>
                        <option>Sirajganj</option>
                        <option>Others..</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="zipcode">Zip Code*</label></td>
                <td><input type="text" id="zipcode" name="zipcode" required></td>
            </tr>

            <tr>
                <td><label for="country">Country*</label></td>
                <td>
                    <select id="country" name="country" required>
                        <option>Select a Country</option>
                        <option>Bangladesh</option>
                        <option>Chaina</option>
                        <option>India</option>
                        <option>Russia</option>
                        <option>Suitzerland</option>
                        <option>Others..</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>

            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="tel" id="fax" name="fax"></td>
            </tr>

            <tr>
                <td><label for="email">Email*</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>

            <tr>
                <td><label>Donation Amount*<br>(Check a button or type in your amount)</label></td>
                <td>
                    <input type="radio" name="donation" value="none" checked >none
                    <input type="radio" name="donation" value="$50">$50
                    <input type="radio" name="donation" value="$75">$75
                    <input type="radio" name="donation" value="$100">$100
                    <input type="radio" name="donation" value="$250">$250
                    <input type="radio" name="donation" value="other">other
                </td>
                </tr>

            <tr>
                <td></td>
                <td>
                <label for="otheramount">Other Amount $</label> 
                <input type="number" id="otheramount" name="otheramount">
            </td>
            </tr>

            <tr>
                <td><label for="recurringdonation">Recurring Donation<br>(check if yes)</label></td>
                <td>
                    <input type="checkbox" id="recurringdonation" name="recurringdonation" value="yes">
                    <label for="recurringdonation">I am interested in giving on a regular basis.</label>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <label for="monthlycreditcard">Monthly Credit Card $</label>
                    <input type="number" id="monthlycreditcard" name="monthlycreditcard">
                    
                    <label for="months">For</label>
                    <input type="number" id="months" name="months">
                    <label for="months">Months</label>
                </td>
            </tr>

        </table>


        
        </form>
</body>


</html>
